<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#FFC107;--gold2:#FF9800;--dark:#0B1026;--blue:#2563EB;--blue2:#00C6FF;--green:#00C853;--green2:#00E676;--light:#F6F7FB;--red:#FF3B30;--orange:#FF6D00;--purple:#7C4DFF;--pink:#FF4081;--card-shadow:0 10px 30px rgba(11,16,38,.08);--radius:20px}
body{font-family:'Plus Jakarta Sans','Inter',sans-serif;background:var(--light);color:#1A1D29;line-height:1.5;overflow-x:hidden}
a{color:inherit;text-decoration:none} button{font-family:inherit}

/* ===== HEADER ===== */
header{background:rgba(11,16,38,.95);backdrop-filter:blur(12px);color:white;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:12px;border-bottom:2px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,.2)}
.logo{font-size:20px;font-weight:900;line-height:1}
.logo span{background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo small{font-size:10px;color:#94A3B8;letter-spacing:1.5px;font-weight:600}
.logo .dot{width:9px;height:9px;background:var(--green2);border-radius:50%;display:inline-block;box-shadow:0 0 0 4px rgba(0,230,118,.2);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,230,118,.4)}70%{box-shadow:0 0 0 8px rgba(0,230,118,0)}100%{box-shadow:0 0 0 0 rgba(0,230,118,0)}}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.08);color:white;border:1px solid rgba(255,255,255,.12);padding:9px 13px;border-radius:100px;cursor:pointer;font-weight:700;font-size:12.5px;transition:.25s}
nav button:hover{transform:translateY(-2px);background:rgba(255,255,255,.15)}
nav button.active{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#0B1026;border-color:transparent}
nav button.agent-btn{background:linear-gradient(90deg,#7C4DFF,#FF4081);border:0;box-shadow:0 6px 18px rgba(124,77,255,.4)}
.wallet{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#0B1026;padding:9px 15px;border-radius:100px;font-weight:800;font-size:13px}
.userBox{display:flex;gap:8px;align-items:center}
.userBox button{padding:8px 14px;border-radius:100px;border:0;cursor:pointer;font-weight:700;font-size:13px}
#userNameLabel{font-size:13px;font-weight:600;opacity:.9}

/* ===== HERO ===== */
.hero{background:linear-gradient(135deg,#0B1026 0%,#1A237E 35%,#2563EB 70%,#00C6FF 100%);color:white;padding:45px 18px 55px;text-align:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(255,193,7,.35),transparent 70%);top:-180px;right:-100px;border-radius:50%}
.hero:after{content:"";position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(0,230,118,.25),transparent 70%);bottom:-150px;left:-80px;border-radius:50%}
.hero>*{position:relative;z-index:1}
.hero .badge-top{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:7px 14px;border-radius:100px;font-size:12px;font-weight:700}
.hero h1{font-size:36px;line-height:1.05;letter-spacing:-1px;margin:16px 0 10px;font-weight:900}
.hero h1 span{background:linear-gradient(90deg,#FFC107,#FFEB3B,#00E676);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{margin:0 auto 14px;opacity:.92;max-width:640px;font-size:15px}
.hero .wa-btn{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:white;padding:13px 24px;border-radius:100px;font-weight:800;text-decoration:none;margin:8px 4px;box-shadow:0 10px 25px rgba(37,211,102,.35)}
.hero .agent-hero-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(90deg,#7C4DFF,#FF4081);color:white;padding:13px 24px;border-radius:100px;font-weight:800;text-decoration:none;margin:8px 4px;box-shadow:0 10px 25px rgba(124,77,255,.4)}
.hero-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.hero-stats div{background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);padding:10px 16px;border-radius:16px;min-width:110px}
.hero-stats b{font-size:18px;display:block}
.hero-stats span{font-size:11px;opacity:.85}
.search{max-width:540px;margin:18px auto 0;display:flex;background:white;border-radius:100px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.25);padding:4px}
.search input{flex:1;padding:13px 16px;border:0;outline:0;font-size:14px}
.search button{background:#0B1026;color:white;border:0;padding:0 22px;border-radius:100px;font-weight:800;cursor:pointer}

/* ===== LAYOUT ===== */
.container{max-width:1180px;margin:20px auto;padding:0 16px}
.section-title{font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.section-title:after{content:"";flex:1;height:1px;background:#E2E8F0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:white;border-radius:var(--radius);padding:16px;box-shadow:var(--card-shadow);text-align:center;transition:.25s;border:1px solid #EEF0F6;position:relative;overflow:hidden}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(11,16,38,.14);border-color:#FFC107}
.card img{width:100%;height:150px;object-fit:cover;border-radius:14px;background:#E2E8F0}
.card h3{margin:10px 0 4px;font-size:16px;font-weight:800}
.card p{font-size:13px;color:#64748B}
.price{color:var(--green);font-weight:900;font-size:19px;margin:6px 0}
.price s{color:#94A3B8;font-size:13px;font-weight:500;margin-left:6px}
.old-price{font-size:12px;background:#FEF3C7;color:#92400E;padding:3px 8px;border-radius:100px;font-weight:700}
.card button{width:100%;margin-top:9px;padding:11px;border:0;border-radius:12px;background:var(--dark);color:white;font-weight:800;cursor:pointer;font-size:14px}
.card button:hover{background:var(--blue)}
.card .ribbon{position:absolute;top:12px;left:-6px;background:linear-gradient(90deg,#FF3B30,#FF6D00);color:white;font-size:11px;font-weight:800;padding:5px 12px;border-radius:0 100px 100px 0}

/* ===== CATEGORY ROW ===== */
.cat-row{display:flex;gap:10px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.cat-row::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:white;padding:14px 18px;border-radius:18px;box-shadow:var(--card-shadow);cursor:pointer;border:2px solid transparent;min-width:90px}
.cat.active{border-color:var(--gold);background:#FFFBEB}
.cat span{font-size:26px}
.cat b{font-size:12px}

/* ===== TABS & FORMS ===== */
.tabs{margin:16px 0;display:flex;gap:8px;flex-wrap:wrap}
.tabs button{padding:10px 18px;border-radius:100px;border:1px solid #CBD5E1;background:white;cursor:pointer;font-weight:700;font-size:13px}
.tabs button.active{background:var(--dark);color:white}
.form-box{background:white;padding:22px;border-radius:22px;box-shadow:var(--card-shadow);max-width:600px;margin:0 auto;border:1px solid #EEF0F6}
.form-box h2{margin-bottom:10px;font-size:19px;font-weight:900}
input,select,textarea{width:100%;padding:13px 14px;margin:7px 0;border:1.5px solid #E2E8F0;border-radius:12px;outline:0;font-size:14px;font-family:inherit;background:#F8FAFC}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:white;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
label{font-size:12px;font-weight:700;color:#475569}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#00C853,#00E676);color:white;border:0;border-radius:12px;font-weight:800;cursor:pointer;font-size:15px;margin-top:8px;box-shadow:0 8px 20px rgba(0,200,83,.25)}
.btn:hover{transform:translateY(-1px)}
.btn-blue{background:linear-gradient(90deg,#2563EB,#00C6FF)}
.btn-gold{background:linear-gradient(90deg,#FFC107,#FF9800);color:#0B1026}
.btn-dark{background:var(--dark)}
.btn-red{background:linear-gradient(90deg,#FF3B30,#FF6D00)}
.btn-orange{background:linear-gradient(90deg,#FF6D00,#FF9800)}
.btn-purple{background:linear-gradient(90deg,#7C4DFF,#FF4081);box-shadow:0 8px 20px rgba(124,77,255,.3)}

/* ===== CART & MODAL ===== */
.cart{position:fixed;right:16px;bottom:16px;background:var(--dark);color:white;padding:14px 20px;border-radius:100px;cursor:pointer;font-weight:800;z-index:200;box-shadow:0 12px 30px rgba(0,0,0,.3);border:2px solid var(--gold);display:flex;gap:8px;align-items:center}
.cart span{background:var(--gold);color:#0B1026;padding:2px 8px;border-radius:100px;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(11,16,38,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:300;padding:14px}
.modal.show{display:flex}
.modal-inner{background:white;width:100%;max-width:600px;border-radius:22px;padding:22px;max-height:92vh;overflow:auto}
footer{background:var(--dark);color:white;text-align:center;padding:28px 18px;margin-top:40px}
footer a{color:#25D366;font-weight:700}

/* ===== BADGES, TABLES, STATS ===== */
.badge{display:inline-block;background:#DCFCE7;color:#166534;padding:5px 11px;border-radius:100px;font-size:11px;font-weight:800}
.badge-yellow{background:#FEF9C3;color:#854D0E}
.badge-red{background:#FEE2E2;color:#991B1B}
.badge-blue{background:#DBEAFE;color:#1E40AF}
.badge-purple{background:#EDE9FE;color:#5B21B6}
.hidden{display:none}
table{width:100%;border-collapse:collapse;margin-top:10px;background:white;border-radius:16px;overflow:hidden;box-shadow:var(--card-shadow)}
th,td{padding:11px;border-bottom:1px solid #F1F5F9;text-align:left;font-size:13px}
th{background:#F8FAFC;font-weight:800}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.stat{background:white;padding:16px;border-radius:18px;box-shadow:var(--card-shadow);border-left:4px solid var(--gold)}
.stat span{font-size:12px;color:#64748B;font-weight:600}
.stat b{font-size:24px;display:block}
.small{font-size:12px;color:#64748B}

/* ===== TRACKING ===== */
.tracker{position:relative;margin:20px 0;padding-left:20px;border-left:4px solid #E2E8F0}
.track-step{position:relative;padding:0 0 18px 15px}
.track-step:before{content:"";position:absolute;left:-27px;top:0;width:14px;height:14px;border-radius:50%;background:#CBD5E1;border:3px solid white}
.track-step.done:before{background:var(--green)}
.track-step.active:before{background:var(--gold);box-shadow:0 0 0 5px #FEF9C3}
.track-step b{display:block}
.track-step span{font-size:12px;color:#64748B}
.notif{padding:12px;border-radius:14px;background:#F0FDF4;border:1px solid #BBF7D0;margin:8px 0;font-size:13px}

/* ===== FEATURES & PROMO ===== */
.feature{padding:18px;background:white;border-radius:18px;box-shadow:var(--card-shadow);display:flex;gap:12px;align-items:flex-start;text-align:left}
.feature span{font-size:28px;background:#FFFBEB;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:14px;flex-shrink:0}
.feature b{font-size:14px;display:block}
.feature p{font-size:12px;color:#64748B}
.promo{background:linear-gradient(90deg,#FF3B30,#FF6D00);color:white;padding:12px 16px;border-radius:14px;text-align:center;font-weight:800;font-size:13px;margin:14px 0}

/* ===== AGENT BANNER ===== */
.agent-banner{background:linear-gradient(135deg,#7C4DFF,#FF4081,#FF9800);color:white;padding:22px;border-radius:22px;text-align:center;margin:18px 0;box-shadow:0 12px 30px rgba(124,77,255,.35)}
.agent-banner h2{font-size:22px;margin-bottom:6px}
.agent-banner p{font-size:14px;opacity:.95}
.ref-box{background:#F8FAFC;border:2px dashed #7C4DFF;padding:14px;border-radius:14px;word-break:break-all;font-size:13px;font-weight:700;margin:10px 0}
.copy-btn{background:#0B1026;color:white;border:0;padding:10px 16px;border-radius:100px;font-weight:800;cursor:pointer;margin:4px}

/* ===== MOBILE ===== */
@media(max-width:640px){
  .hero h1{font-size:28px}
  header{flex-direction:column;text-align:center}
  .hero-stats div{min-width:95px}
}
</style>
